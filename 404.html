<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>404 - Seite nicht gefunden | Men’s Cut by Taskin Berlin</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        :root {
            --gold: #C9A24D;
            --gold-light: #DFC17B;
            --dark: #1a1a1a;
            --darker: #0f0f0f;
            --white: #fff;
            --text-light: #aaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--darker);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .error-container {
            max-width: 550px;
            background: rgba(26, 26, 26, 0.85);
            border: 1px solid rgba(201, 162, 77, 0.25);
            padding: 48px 32px;
            border-radius: 8px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        }

        .error-logo {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #fff;
            padding: 2px;
            margin-bottom: 24px;
            object-fit: contain;
        }

        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            line-height: 1;
            color: var(--gold);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .error-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 16px;
            color: var(--white);
        }

        .error-desc {
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--gold);
            color: #000;
        }

        .btn-primary:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .error-footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <img src="images/logo.png" alt="Men's Cut by Taskin" class="error-logo" width="72" height="72" />
        <div class="error-code">404</div>
        <h1 class="error-title">Seite nicht gefunden</h1>
        <p class="error-desc">Die von Ihnen gesuchte Seite existiert leider nicht oder wurde verschoben. Kehren Sie zur Startseite zurück oder rufen Sie uns direkt an.</p>
        <div class="error-actions">
            <a href="https://menscutbarber.de/" class="btn btn-primary">Zur Startseite</a>
            <a href="tel:+493068053010" class="btn btn-secondary">Termin anrufen</a>
        </div>
        <div class="error-footer">
            Men’s Cut by Taskin · Anzengruberstraße 4, 12043 Berlin
        </div>
    </div>
</body>

</html>
